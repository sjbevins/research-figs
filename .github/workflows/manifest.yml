name: Rebuild figure manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - 'manifest.json'
      - 'index.html'
      - 'README.md'

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_manifest.py --root .
      - name: Commit manifest if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "chore: rebuild manifest.json"
          git push
